<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地铁跑酷</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: #333;
        }

        .game-container {
            background: white;
            border-radius: 18px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 520px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.4em;
            color: #b21f1f;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            background: #fff3e0;
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.85em;
            flex-wrap: wrap;
            gap: 6px;
        }

        .hud span {
            color: #b21f1f;
        }

        .canvas-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        canvas {
            background: #87ceeb;
            border-radius: 12px;
            display: block;
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            touch-action: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 14px;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }

        .overlay.show { display: flex; }
        .overlay h2 { font-size: 1.5em; }
        .overlay p { font-size: 1em; color: #ddd; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
        }

        button.ctrl, .link-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #b21f1f, #fdbb2d);
            color: white;
            box-shadow: 0 4px 12px rgba(178, 31, 31, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #b21f1f;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .touch-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .touch-controls button {
            min-width: 70px;
            padding: 14px 16px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .touch-controls button:active {
            transform: scale(0.92);
        }

        .rules {
            margin-top: 14px;
            background: #fff8f0;
            border-left: 4px solid #b21f1f;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.82em;
            line-height: 1.6;
            color: #555;
        }

        .rules h3 {
            color: #b21f1f;
            margin-bottom: 6px;
            font-size: 1em;
        }

        .key-hint {
            display: inline-block;
            background: #ffe8e0;
            border: 1px solid #ffc4b0;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: monospace;
            font-size: 0.9em;
            margin: 0 2px;
            color: #b21f1f;
        }

        @media (max-width: 460px) {
            .header h1 { font-size: 1.2em; }
            .game-container { padding: 12px; }
            .hud { font-size: 0.78em; }
            .touch-controls button { min-width: 60px; padding: 12px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🚇 地铁跑酷 🚇</h1>
        </div>

        <div class="hud">
            <div>得分：<span id="score">0</span></div>
            <div>金币：<span id="coins">0</span></div>
            <div>最高分：<span id="best">0</span></div>
            <div>速度：<span id="speed">1</span>x</div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game" width="400" height="560"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">游戏结束</h2>
                <p id="overlay-text">得分：0</p>
                <button class="btn-primary" onclick="initGame()">再来一局</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary ctrl" onclick="initGame()">🔄 重新开始</button>
            <a href="index.html" class="link-btn btn-secondary">🏠 返回主页</a>
        </div>

        <div class="touch-controls">
            <button onmousedown="moveLane(-1)" ontouchstart="event.preventDefault();moveLane(-1)">◀ 左</button>
            <button onmousedown="jump()" ontouchstart="event.preventDefault();jump()">▲ 跳</button>
            <button onmousedown="slide()" ontouchstart="event.preventDefault();slide()">▼ 滑</button>
            <button onmousedown="moveLane(1)" ontouchstart="event.preventDefault();moveLane(1)">右 ▶</button>
        </div>

        <div class="rules">
            <h3>📖 游戏说明</h3>
            <p>1. 你在地铁轨道上奔跑，前方会有火车、路障和金币，注意躲避障碍并收集金币。</p>
            <p>2. 电脑操作：<span class="key-hint">←</span> <span class="key-hint">→</span> 左右切换轨道，
               <span class="key-hint">↑</span> 或 <span class="key-hint">空格</span> 跳跃，
               <span class="key-hint">↓</span> 滑铲通过低矮障碍。</p>
            <p>3. 手机操作：用下方按钮进行左移、跳跃、滑铲和右移。</p>
            <p>4. 手机上也支持触摸滑动：左右滑动切换轨道，上滑跳跃，下滑滑铲。</p>
            <p>5. 每收集一枚金币 +10 分，随着距离越远，奔跑速度会逐渐加快。</p>
            <p>6. 撞到障碍物则游戏结束。</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const LANES = 3;
        const ROAD_W = W * 0.9;
        const ROAD_LEFT = (W - ROAD_W) / 2;
        const HORIZON = H * 0.35;
        const PLAYER_Y = H * 0.85;

        const laneX = [
            ROAD_LEFT + ROAD_W * 0.2,
            ROAD_LEFT + ROAD_W * 0.5,
            ROAD_LEFT + ROAD_W * 0.8
        ];

        let score = 0;
        let coins = 0;
        let best = parseInt(localStorage.getItem('subway_best') || '0', 10);
        let speed = 1;
        let distance = 0;

        let gameOver = false;
        let paused = false;

        let player = {
            lane: 1,
            targetLane: 1,
            x: laneX[1],
            y: PLAYER_Y,
            w: 50,
            h: 70,
            jumping: false,
            jumpT: 0,
            sliding: false,
            slideT: 0
        };

        let objects = [];
        let nextSpawnZ = 0;
        let spawnInterval = 90;
        let frame = 0;

        const scoreEl = document.getElementById('score');
        const coinsEl = document.getElementById('coins');
        const bestEl = document.getElementById('best');
        const speedEl = document.getElementById('speed');
        const overlayEl = document.getElementById('overlay');

        bestEl.textContent = best;

        function initGame() {
            gameOver = false;
            paused = false;
            score = 0;
            coins = 0;
            speed = 1;
            distance = 0;
            frame = 0;
            objects = [];
            nextSpawnZ = 60;
            spawnInterval = 90;

            player = {
                lane: 1,
                targetLane: 1,
                x: laneX[1],
                y: PLAYER_Y,
                w: 50,
                h: 70,
                jumping: false,
                jumpT: 0,
                sliding: false,
                slideT: 0
            };

            scoreEl.textContent = 0;
            coinsEl.textContent = 0;
            speedEl.textContent = 1;
            overlayEl.classList.remove('show');
        }

        function moveLane(dir) {
            if (gameOver) return;
            if (player.jumping || player.sliding) return;
            const newLane = Math.max(0, Math.min(LANES - 1, player.targetLane + dir));
            if (newLane !== player.targetLane) {
                player.targetLane = newLane;
            }
        }

        function jump() {
            if (gameOver) return;
            if (player.jumping || player.sliding) return;
            player.jumping = true;
            player.jumpT = 0;
        }

        function slide() {
            if (gameOver) return;
            if (player.jumping || player.sliding) return;
            player.sliding = true;
            player.slideT = 0;
        }

        function project(lane, z) {
            const t = z / (z + 400);
            const scale = 1 - t * 0.85;
            const cx = W / 2;
            const laneWidthNear = ROAD_W / LANES;
            const laneCenterNear = ROAD_LEFT + laneWidthNear * (lane + 0.5);
            const x = cx + (laneCenterNear - cx) * scale;
            const y = PLAYER_Y - (PLAYER_Y - HORIZON) * t;
            return { x, y, scale, t };
        }

        function spawnObject() {
            const lane = Math.floor(Math.random() * LANES);
            const r = Math.random();
            let type;
            if (r < 0.35) type = 'train';
            else if (r < 0.55) type = 'barrier';
            else if (r < 0.7) type = 'slide';
            else type = 'coin';

            objects.push({
                z: nextSpawnZ,
                lane,
                type,
                collected: false,
                hit: false
            });

            if (type === 'coin') {
                for (let i = 1; i < 3; i++) {
                    objects.push({
                        z: nextSpawnZ + i * 25,
                        lane,
                        type: 'coin',
                        collected: false,
                        hit: false
                    });
                }
            }

            nextSpawnZ += spawnInterval;
        }

        function update() {
            if (gameOver || paused) return;
            frame++;

            const targetX = laneX[player.targetLane];
            player.x += (targetX - player.x) * 0.25;
            player.lane = player.targetLane;

            if (player.jumping) {
                player.jumpT += 0.07;
                if (player.jumpT >= 1) {
                    player.jumping = false;
                    player.jumpT = 0;
                }
            }
            if (player.sliding) {
                player.slideT += 0.06;
                if (player.slideT >= 1) {
                    player.sliding = false;
                    player.slideT = 0;
                }
            }

            distance += speed;
            if (frame % 15 === 0) {
                score += 1;
                scoreEl.textContent = score;
            }
            if (frame % 300 === 0) {
                speed += 0.25;
                speedEl.textContent = speed.toFixed(2);
            }

            let maxZ = 0;
            objects.forEach(o => { if (o.z > maxZ) maxZ = o.z; });
            if (maxZ < 500) {
                spawnObject();
            }

            for (let i = objects.length - 1; i >= 0; i--) {
                const o = objects[i];
                o.z -= speed * 3;

                if (o.z < -50) {
                    objects.splice(i, 1);
                    continue;
                }

                if (!o.hit && !o.collected && o.z < 30 && o.z > -10) {
                    if (o.lane === player.lane) {
                        if (o.type === 'coin') {
                            o.collected = true;
                            coins++;
                            score += 10;
                            coinsEl.textContent = coins;
                            scoreEl.textContent = score;
                        } else if (o.type === 'train') {
                            o.hit = true;
                            endGame();
                        } else if (o.type === 'barrier') {
                            const jumpHeight = player.jumping ? Math.sin(Math.PI * player.jumpT) : 0;
                            if (jumpHeight < 0.5) {
                                o.hit = true;
                                endGame();
                            }
                        } else if (o.type === 'slide') {
                            if (!player.sliding) {
                                o.hit = true;
                                endGame();
                            }
                        }
                    }
                }
            }
        }

        function drawTrack() {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON + 50);
            skyGrad.addColorStop(0, '#1a2a6c');
            skyGrad.addColorStop(0.5, '#4a5fa8');
            skyGrad.addColorStop(1, '#87ceeb');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, HORIZON + 50);

            ctx.fillStyle = '#3a4a7c';
            for (let i = 0; i < 8; i++) {
                const bw = 30 + (i % 3) * 15;
                const bh = 40 + (i % 4) * 25;
                const bx = (i * 60) % W;
                ctx.fillRect(bx, HORIZON - bh + 20, bw, bh);
            }

            ctx.fillStyle = '#c8b89a';
            ctx.fillRect(0, HORIZON + 30, W, H - HORIZON);

            ctx.fillStyle = '#5a5a5a';
            ctx.beginPath();
            ctx.moveTo(W / 2 - ROAD_W * 0.15, HORIZON + 30);
            ctx.lineTo(W / 2 + ROAD_W * 0.15, HORIZON + 30);
            ctx.lineTo(ROAD_LEFT + ROAD_W, H);
            ctx.lineTo(ROAD_LEFT, H);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#f0d000';
            ctx.lineWidth = 2;
            for (let l = 1; l < LANES; l++) {
                const xNear = ROAD_LEFT + (ROAD_W / LANES) * l;
                const xFar = W / 2 + (xNear - W / 2) * 0.15;
                ctx.beginPath();
                ctx.moveTo(xFar, HORIZON + 30);
                ctx.lineTo(xNear, H);
                ctx.stroke();
            }

            const offset = (frame * speed * 3) % 60;
            ctx.strokeStyle = 'rgba(120, 80, 40, 0.5)';
            ctx.lineWidth = 3;
            for (let z = 60 - offset; z < 500; z += 60) {
                const t = z / (z + 400);
                const y = PLAYER_Y - (PLAYER_Y - HORIZON) * t;
                const halfW = (ROAD_W / 2) * (1 - t * 0.85);
                ctx.beginPath();
                ctx.moveTo(W / 2 - halfW, y);
                ctx.lineTo(W / 2 + halfW, y);
                ctx.stroke();
            }
        }

        function drawObject(o) {
            const p = project(o.lane, o.z);
            if (p.y < HORIZON) return;

            if (o.type === 'coin') {
                if (o.collected) return;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(p.x, p.y - 15 * p.scale, 12 * p.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b8860b';
                ctx.lineWidth = 2 * p.scale;
                ctx.stroke();
                ctx.fillStyle = '#b8860b';
                ctx.font = `bold ${14 * p.scale}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', p.x, p.y - 15 * p.scale);
                return;
            }

            const w = 60 * p.scale;
            const h = (o.type === 'train' ? 90 : 50) * p.scale;
            const x = p.x - w / 2;
            const y = p.y - h;

            if (o.type === 'train') {
                ctx.fillStyle = '#c0392b';
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(x + w * 0.1, y + h * 0.1, w * 0.8, h * 0.3);
                ctx.fillStyle = '#87ceeb';
                ctx.fillRect(x + w * 0.15, y + h * 0.15, w * 0.3, h * 0.2);
                ctx.fillRect(x + w * 0.55, y + h * 0.15, w * 0.3, h * 0.2);
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.arc(x + w * 0.25, y + h, w * 0.12, 0, Math.PI * 2);
                ctx.arc(x + w * 0.75, y + h, w * 0.12, 0, Math.PI * 2);
                ctx.fill();
            } else if (o.type === 'barrier') {
                ctx.fillStyle = '#f39c12';
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = '#000';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(x + i * w / 4, y, w / 8, h);
                }
                ctx.fillStyle = '#e67e22';
                ctx.fillRect(x - w * 0.1, y + h - 5 * p.scale, w * 1.2, 5 * p.scale);
            } else if (o.type === 'slide') {
                ctx.fillStyle = '#8e44ad';
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + w, y);
                ctx.lineTo(x + w, y + h * 0.5);
                ctx.lineTo(x, y + h * 0.5);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#9b59b6';
                ctx.fillRect(x, y + h * 0.4, w, h * 0.15);
            }
        }

        function drawPlayer() {
            const px = player.x;
            let py = player.y;
            let w = player.w;
            let h = player.h;

            if (player.jumping) {
                const jumpHeight = Math.sin(Math.PI * player.jumpT) * 100;
                py -= jumpHeight;
            }
            if (player.sliding) {
                const t = Math.sin(Math.PI * player.slideT);
                h = player.h * (1 - t * 0.6);
                py = player.y + (player.h - h);
            }

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(px, player.y + player.h, w * 0.5, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(px - w * 0.3, py + h * 0.6, w * 0.25, h * 0.4);
            ctx.fillRect(px + w * 0.05, py + h * 0.6, w * 0.25, h * 0.4);

            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(px - w * 0.35, py + h * 0.25, w * 0.7, h * 0.4);

            ctx.fillStyle = '#f5c6a5';
            ctx.beginPath();
            ctx.arc(px, py + h * 0.15, w * 0.28, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(px, py + h * 0.08, w * 0.32, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(px - w * 0.4, py + h * 0.05, w * 0.8, h * 0.05);

            const armSwing = Math.sin(frame * 0.4) * 6;
            ctx.fillStyle = '#f5c6a5';
            ctx.beginPath();
            ctx.arc(px - w * 0.45, py + h * 0.4 + armSwing, 6, 0, Math.PI * 2);
            ctx.arc(px + w * 0.45, py + h * 0.4 - armSwing, 6, 0, Math.PI * 2);
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            drawTrack();

            const sorted = [...objects].sort((a, b) => b.z - a.z);
            for (const o of sorted) {
                drawObject(o);
            }

            drawPlayer();
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        function endGame() {
            gameOver = true;
            if (score > best) {
                best = score;
                localStorage.setItem('subway_best', best);
                bestEl.textContent = best;
            }
            document.getElementById('overlay-title').textContent = '游戏结束';
            document.getElementById('overlay-text').textContent = `得分：${score}  金币：${coins}`;
            overlayEl.classList.add('show');
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowLeft': moveLane(-1); break;
                case 'ArrowRight': moveLane(1); break;
                case 'ArrowUp': case ' ': jump(); break;
                case 'ArrowDown': slide(); break;
            }
        });

        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        canvas.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!e.changedTouches[0]) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            const dt = Date.now() - touchStartTime;
            const absX = Math.abs(dx), absY = Math.abs(dy);

            if (absX < 20 && absY < 20 && dt < 300) {
                jump();
                return;
            }

            if (absX > absY) {
                if (dx > 30) moveLane(1);
                else if (dx < -30) moveLane(-1);
            } else {
                if (dy < -30) jump();
                else if (dy > 30) slide();
            }
        }, { passive: true });

        canvas.addEventListener('click', () => {
            jump();
        });

        initGame();
        loop();
    </script>
</body>
</html>
