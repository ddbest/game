<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易消消乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2c3e50;
            color: #fff;
            font-family: "Microsoft Yahei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding:30px 10px;
        }
        .rule{
            background:#34495e;
            padding:16px;
            border-radius:10px;
            max-width:420px;
            margin-bottom:20px;
            line-height:1.6;
        }
        h1 {
            margin-bottom:10px;
            color: #f1c40f;
        }
        .info{
            font-size:20px;
            margin-bottom:20px;
        }
        #score{
            color:#2ecc71;
            font-weight:bold;
        }
        #gameWrap{
            display: grid;
            grid-template-columns: repeat(6, 60px);
            gap:4px;
            background:#34495e;
            padding:8px;
            border-radius:10px;
        }
        .cell{
            width:60px;
            height:60px;
            border-radius:8px;
            cursor:pointer;
            transition: 0.2s;
        }
        .cell:hover{
            transform: scale(1.05);
        }
        .selected{
            box-shadow: 0 0 0 3px #fff;
        }
        button{
            margin-top:20px;
            padding:10px 20px;
            font-size:18px;
            border:none;
            border-radius:8px;
            background:#e74c3c;
            color:white;
            cursor:pointer;
        }
        button:hover{
            background:#c0392b;
        }
        .back{
            margin-top:24px;
        }
        .back a{
            color:#ccc;
            font-size:18px;
        }
    </style>
</head>
<body>
    <h1>🍬简易消消乐</h1>
    <div class="rule">
        <b>玩法说明：</b>点击第一个方块选中（出现白色外框），再点击上下左右相邻的同色方块，两个方块消除，获得10分。点击重新开始重置棋盘。
    </div>
    <div class="info">得分：<span id="score">0</span></div>
    <div id="gameWrap"></div>
    <button onclick="restartGame()">重新开始</button>
    <div class="back">
        <a href="index.html">← 返回主页</a>
    </div>

    <script>
        const wrap = document.getElementById('gameWrap');
        const scoreDom = document.getElementById('score');
        const colors = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'];
        const rows = 6;
        const cols = 6;
        let grid = [];
        let selected = null;
        let score = 0;

        function initBoard(){
            wrap.innerHTML = "";
            grid = [];
            selected = null;
            score = 0;
            scoreDom.innerText = score;
            for(let y=0;y<rows;y++){
                grid[y] = [];
                for(let x=0;x<cols;x++){
                    const colorIndex = Math.floor(Math.random()*colors.length);
                    grid[y][x] = colorIndex;
                    const div = document.createElement('div');
                    div.className = "cell";
                    div.style.backgroundColor = colors[colorIndex];
                    div.dataset.x = x;
                    div.dataset.y = y;
                    div.addEventListener('click', ()=>clickCell(x,y,div));
                    wrap.appendChild(div);
                }
            }
        }

        function isAdjacent(x1,y1,x2,y2){
            const dx = Math.abs(x1-x2);
            const dy = Math.abs(y1-y2);
            return (dx===1 && dy===0) || (dx===0 && dy===1);
        }

        function clickCell(x,y,dom){
            if(!selected){
                selected = {x,y,dom};
                dom.classList.add('selected');
            }else{
                if(selected.x === x && selected.y === y){
                    selected.dom.classList.remove('selected');
                    selected = null;
                    return;
                }
                if(isAdjacent(selected.x,selected.y,x,y) && grid[y][x] === grid[selected.y][selected.x]){
                    grid[y][x] = null;
                    grid[selected.y][selected.x] = null;
                    dom.style.backgroundColor = "#34495e";
                    selected.dom.style.backgroundColor = "#34495e";
                    score +=10;
                    scoreDom.innerText = score;
                }
                selected.dom.classList.remove('selected');
                selected = null;
            }
        }

        function restartGame(){
            initBoard();
        }
        initBoard();
    </script>
</body>
</html>
