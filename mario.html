<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级玛丽</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 820px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6em;
            color: #e63946;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.95em;
        }

        .hud span {
            color: #e63946;
        }

        .canvas-wrap {
            position: relative;
            display: flex;
            justify-content: center;
        }

        canvas {
            background: #87ceeb;
            border-radius: 10px;
            display: block;
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 14px;
            text-align: center;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay h2 {
            font-size: 1.8em;
        }

        .overlay p {
            font-size: 1em;
            color: #ddd;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        button, .link-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #e63946);
            color: white;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #e63946;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .touch-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .touch-controls button {
            min-width: 90px;
            padding: 14px 18px;
            background: #4ecdc4;
            color: white;
            font-size: 1em;
            border-radius: 12px;
        }

        .rules {
            margin-top: 15px;
            background: #fff8f8;
            border-left: 4px solid #e63946;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            line-height: 1.6;
            color: #555;
        }

        .rules h3 {
            color: #e63946;
            margin-bottom: 6px;
            font-size: 1em;
        }

        .key-hint {
            display: inline-block;
            background: #ffe8e8;
            border: 1px solid #ffcccc;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: monospace;
            font-size: 0.9em;
            margin: 0 2px;
            color: #e63946;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.3em; }
            .hud { font-size: 0.85em; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🍄 超级玛丽 🍄</h1>
        </div>

        <div class="hud">
            <div>得分：<span id="score">0</span></div>
            <div>金币：<span id="coins">0</span></div>
            <div>生命：<span id="lives">3</span></div>
            <div>关卡：<span id="level">1</span></div>
        </div>

        <div class="canvas-wrap">
            <canvas id="game" width="800" height="400"></canvas>
            <div class="overlay" id="overlay">
                <h2 id="overlay-title">游戏结束</h2>
                <p id="overlay-text">得分：0</p>
                <button class="btn-primary" onclick="initGame()">再来一局</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="initGame()">🔄 重新开始</button>
            <a href="index.html" class="link-btn btn-secondary">🏠 返回主页</a>
        </div>

        <div class="touch-controls">
            <button onmousedown="keys.left=true" onmouseup="keys.left=false" ontouchstart="event.preventDefault();keys.left=true" ontouchend="keys.left=false">◀ 左</button>
            <button onmousedown="jump()" ontouchstart="event.preventDefault();jump()">▲ 跳</button>
            <button onmousedown="keys.right=true" onmouseup="keys.right=false" ontouchstart="event.preventDefault();keys.right=true" ontouchend="keys.right=false">右 ▶</button>
        </div>

        <div class="rules">
            <h3>📖 游戏说明</h3>
            <p>1. 控制玛丽从左侧出发，一路向右前进，到达旗杆即可过关。</p>
            <p>2. 操作键：<span class="key-hint">←</span> <span class="key-hint">→</span> 左右移动，
               <span class="key-hint">空格</span> 或 <span class="key-hint">↑</span> 跳跃。</p>
            <p>3. 踩在敌人头上可以击败敌人并得分，被碰到会损失一条生命。</p>
            <p>4. 收集金币可以增加得分，掉进深坑会损失生命。</p>
            <p>5. 生命耗尽则游戏结束，到达旗杆后进入下一关，速度会提升。</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const GRAVITY = 0.6;
        const JUMP_POWER = -12;
        const MOVE_SPEED = 4;
        const GROUND_Y = H - 40;

        let score = 0, coins = 0, lives = 3, level = 1;
        let gameOver = false, win = false;
        let cameraX = 0;

        const keys = { left: false, right: false, jump: false };

        const player = {
            x: 60, y: 0, w: 28, h: 36,
            vx: 0, vy: 0,
            onGround: false,
            facing: 1,
            invincible: 0
        };

        let platforms = [];
        let enemies = [];
        let coinItems = [];
        let flag = { x: 0, y: 0, w: 8, h: 120 };

        const LEVEL_LENGTH = 2600;

        function buildLevel() {
            platforms = [];
            enemies = [];
            coinItems = [];

            // 地面（有缺口）
            const groundSegments = [
                [0, 900], [1000, 1600], [1750, LEVEL_LENGTH]
            ];
            groundSegments.forEach(([x1, x2]) => {
                platforms.push({ x: x1, y: GROUND_Y, w: x2 - x1, h: 40, type: 'ground' });
            });

            // 空中平台
            const airPlatforms = [
                { x: 300, y: GROUND_Y - 100, w: 120, h: 20 },
                { x: 500, y: GROUND_Y - 160, w: 100, h: 20 },
                { x: 750, y: GROUND_Y - 90, w: 140, h: 20 },
                { x: 1100, y: GROUND_Y - 120, w: 120, h: 20 },
                { x: 1350, y: GROUND_Y - 180, w: 100, h: 20 },
                { x: 1500, y: GROUND_Y - 100, w: 120, h: 20 },
                { x: 1850, y: GROUND_Y - 130, w: 140, h: 20 },
                { x: 2100, y: GROUND_Y - 90, w: 120, h: 20 },
            ];
            airPlatforms.forEach(p => platforms.push({ ...p, type: 'brick' }));

            // 金币
            airPlatforms.forEach(p => {
                for (let i = 0; i < 3; i++) {
                    coinItems.push({
                        x: p.x + 20 + i * 35,
                        y: p.y - 30,
                        r: 10,
                        collected: false
                    });
                }
            });

            // 敌人（在平台上或地面巡逻）
            const enemyData = [
                { x: 400, y: GROUND_Y - 32, minX: 350, maxX: 600 },
                { x: 800, y: GROUND_Y - 32, minX: 750, maxX: 950 },
                { x: 1150, y: GROUND_Y - 32, minX: 1100, maxX: 1250 },
                { x: 1500, y: GROUND_Y - 32, minX: 1450, maxX: 1650 },
                { x: 1900, y: GROUND_Y - 32, minX: 1850, maxX: 2050 },
                { x: 2200, y: GROUND_Y - 32, minX: 2150, maxX: 2350 },
            ];
            enemyData.forEach(e => {
                enemies.push({
                    x: e.x, y: e.y, w: 30, h: 30,
                    vx: 1.5, minX: e.minX, maxX: e.maxX,
                    alive: true, squashTimer: 0
                });
            });

            // 旗杆
            flag.x = LEVEL_LENGTH - 80;
            flag.y = GROUND_Y - flag.h;
        }

        function resetPlayer() {
            player.x = 60;
            player.y = GROUND_Y - player.h;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            player.invincible = 90;
            cameraX = 0;
        }

        function jump() {
            if (gameOver || win) return;
            if (player.onGround) {
                player.vy = JUMP_POWER;
                player.onGround = false;
            }
        }

        function updateHUD() {
            document.getElementById('score').textContent = score;
            document.getElementById('coins').textContent = coins;
            document.getElementById('lives').textContent = lives;
            document.getElementById('level').textContent = level;
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                   a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function update() {
            if (gameOver || win) return;

            // 水平移动
            if (keys.left) {
                player.vx = -MOVE_SPEED;
                player.facing = -1;
            } else if (keys.right) {
                player.vx = MOVE_SPEED;
                player.facing = 1;
            } else {
                player.vx = 0;
            }

            player.x += player.vx;

            // 边界
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > LEVEL_LENGTH) {
                player.x = LEVEL_LENGTH - player.w;
            }

            // 重力
            player.vy += GRAVITY;
            player.y += player.vy;

            // 平台碰撞
            player.onGround = false;
            for (const p of platforms) {
                if (player.vy >= 0 &&
                    player.x + player.w > p.x &&
                    player.x < p.x + p.w &&
                    player.y + player.h >= p.y &&
                    player.y + player.h <= p.y + p.h + player.vy + 2) {
                    player.y = p.y - player.h;
                    player.vy = 0;
                    player.onGround = true;
                }
            }

            // 掉坑
            if (player.y > H + 100) {
                loseLife();
                return;
            }

            // 敌人
            for (const e of enemies) {
                if (!e.alive) {
                    if (e.squashTimer > 0) e.squashTimer--;
                    continue;
                }
                e.x += e.vx;
                if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;

                if (rectCollide(player, e)) {
                    // 从上方踩
                    if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 10) {
                        e.alive = false;
                        e.squashTimer = 30;
                        player.vy = JUMP_POWER * 0.7;
                        score += 100;
                        updateHUD();
                    } else if (player.invincible <= 0) {
                        loseLife();
                        return;
                    }
                }
            }

            // 金币
            for (const c of coinItems) {
                if (c.collected) continue;
                const dx = (player.x + player.w / 2) - c.x;
                const dy = (player.y + player.h / 2) - c.y;
                if (Math.sqrt(dx * dx + dy * dy) < c.r + 16) {
                    c.collected = true;
                    coins++;
                    score += 50;
                    updateHUD();
                }
            }

            // 无敌帧
            if (player.invincible > 0) player.invincible--;

            // 到达旗杆
            if (player.x + player.w > flag.x && player.y + player.h > flag.y) {
                winLevel();
            }

            // 摄像机
            const targetCam = Math.max(0, Math.min(player.x - W / 3, LEVEL_LENGTH - W));
            cameraX += (targetCam - cameraX) * 0.1;
        }

        function loseLife() {
            lives--;
            updateHUD();
            if (lives <= 0) {
                endGame('游戏结束', `最终得分：${score}`);
            } else {
                resetPlayer();
            }
        }

        function winLevel() {
            win = true;
            score += 500;
            updateHUD();
            showOverlay('过关！', `得分：${score}`, '下一关');
        }

        function showOverlay(title, text, btnText) {
            const overlay = document.getElementById('overlay');
            document.getElementById('overlay-title').textContent = title;
            document.getElementById('overlay-text').textContent = text;
            overlay.querySelector('button').textContent = btnText || '再来一局';
            overlay.classList.add('show');
        }

        function endGame(title, text) {
            gameOver = true;
            showOverlay(title, text, '再来一局');
        }

        function drawBackground() {
            // 天空渐变
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#87ceeb');
            grad.addColorStop(1, '#c9e8f5');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 云朵（视差）
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            const cloudOffset = cameraX * 0.3;
            for (let i = 0; i < 8; i++) {
                const cx = ((i * 350 - cloudOffset) % (W + 400)) - 100;
                const cy = 40 + (i % 3) * 40;
                drawCloud(cx, cy, 50 + (i % 3) * 15);
            }

            // 远山
            ctx.fillStyle = '#7ec850';
            const hillOffset = cameraX * 0.5;
            for (let i = 0; i < 10; i++) {
                const hx = ((i * 400 - hillOffset) % (W + 500)) - 100;
                ctx.beginPath();
                ctx.arc(hx, GROUND_Y + 20, 120, Math.PI, 0);
                ctx.fill();
            }
        }

        function drawCloud(x, y, r) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.arc(x + r, y, r * 0.8, 0, Math.PI * 2);
            ctx.arc(x - r * 0.8, y + 5, r * 0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPlatform(p) {
            if (p.type === 'ground') {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                ctx.fillStyle = '#7ec850';
                ctx.fillRect(p.x - cameraX, p.y, p.w, 10);
            } else {
                ctx.fillStyle = '#c84b31';
                ctx.fillRect(p.x - cameraX, p.y, p.w, p.h);
                ctx.strokeStyle = '#8b2e1a';
                ctx.lineWidth = 2;
                for (let i = 0; i < p.w; i += 20) {
                    ctx.strokeRect(p.x - cameraX + i, p.y, 20, p.h);
                }
            }
        }

        function drawPlayer() {
            const px = player.x - cameraX;
            const py = player.y;

            if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) {
                return;
            }

            // 身体（工装裤）
            ctx.fillStyle = '#1e5cb3';
            ctx.fillRect(px, py + player.h * 0.45, player.w, player.h * 0.55);

            // 上衣（红衬衫）
            ctx.fillStyle = '#e63946';
            ctx.fillRect(px, py + player.h * 0.25, player.w, player.h * 0.25);

            // 头
            ctx.fillStyle = '#f5c6a5';
            ctx.beginPath();
            ctx.arc(px + player.w / 2, py + player.h * 0.15, player.w * 0.45, 0, Math.PI * 2);
            ctx.fill();

            // 帽子
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.arc(px + player.w / 2, py + player.h * 0.1, player.w * 0.5, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(px - 4, py + player.h * 0.05, player.w + 8, 6);

            // 眼睛
            ctx.fillStyle = '#000';
            const eyeX = player.facing === 1 ? px + player.w * 0.65 : px + player.w * 0.35;
            ctx.beginPath();
            ctx.arc(eyeX, py + player.h * 0.15, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // 胡子
            ctx.fillStyle = '#4a2c1a';
            ctx.fillRect(px + player.w * 0.3, py + player.h * 0.25, player.w * 0.5, 4);
        }

        function drawEnemy(e) {
            const ex = e.x - cameraX;
            if (!e.alive) {
                if (e.squashTimer > 0) {
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(ex, e.y + e.h - 8, e.w, 8);
                }
                return;
            }
            // 蘑菇怪
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.arc(ex + e.w / 2, e.y + e.h * 0.4, e.w * 0.5, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(ex + 4, e.y + e.h * 0.35, e.w - 8, e.h * 0.6);
            // 眼睛
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ex + e.w * 0.35, e.y + e.h * 0.5, 3, 0, Math.PI * 2);
            ctx.arc(ex + e.w * 0.65, e.y + e.h * 0.5, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(ex + e.w * 0.35, e.y + e.h * 0.5, 1.5, 0, Math.PI * 2);
            ctx.arc(ex + e.w * 0.65, e.y + e.h * 0.5, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCoins() {
            for (const c of coinItems) {
                if (c.collected) continue;
                const cx = c.x - cameraX;
                if (cx < -50 || cx > W + 50) continue;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(cx, c.y, c.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b8860b';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#b8860b';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', cx, c.y + 1);
            }
        }

        function drawFlag() {
            const fx = flag.x - cameraX;
            // 杆
            ctx.fillStyle = '#888';
            ctx.fillRect(fx, flag.y, flag.w, flag.h);
            // 旗帜
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.moveTo(fx + flag.w, flag.y + 10);
            ctx.lineTo(fx + flag.w + 40, flag.y + 30);
            ctx.lineTo(fx + flag.w, flag.y + 50);
            ctx.fill();
        }

        function render() {
            drawBackground();

            for (const p of platforms) {
                if (p.x - cameraX < W && p.x + p.w - cameraX > 0) {
                    drawPlatform(p);
                }
            }

            drawCoins();

            for (const e of enemies) {
                if (e.x - cameraX < W && e.x + e.w - cameraX > 0) {
                    drawEnemy(e);
                }
            }

            drawFlag();
            drawPlayer();

            // 顶部渐变遮罩让 HUD 更好看
            const topGrad = ctx.createLinearGradient(0, 0, 0, 60);
            topGrad.addColorStop(0, 'rgba(0,0,0,0.25)');
            topGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, W, 60);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`得分: ${score}  |  金币: ${coins}  |  生命: ${lives}`, 12, 10);
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        // 键盘
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowLeft': keys.left = true; break;
                case 'ArrowRight': keys.right = true; break;
                case 'ArrowUp': case ' ': jump(); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.key) {
                case 'ArrowLeft': keys.left = false; break;
                case 'ArrowRight': keys.right = false; break;
            }
        });

        function initGame() {
            if (win) {
                // 进入下一关
                level++;
                win = false;
            } else {
                level = 1;
                score = 0;
                coins = 0;
                lives = 3;
            }
            gameOver = false;
            win = false;

            buildLevel();
            resetPlayer();
            updateHUD();

            document.getElementById('overlay').classList.remove('show');
        }

        // 处理 overlay 中的"下一关"或"再来一局"
        document.querySelector('#overlay button').addEventListener('click', () => {
            if (document.getElementById('overlay-title').textContent === '过关！') {
                initGame();
            } else {
                score = 0; coins = 0; lives = 3; level = 1;
                initGame();
            }
        });

        initGame();
        loop();
    </script>
</body>
</html>
