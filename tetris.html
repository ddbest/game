<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>俄罗斯方块</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            touch-action: none;
            overscroll-behavior: none;
        }

        .game-container {
            background: white;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 460px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header {
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.1em;
            color: #2a5298;
        }

        /* 游戏区：棋盘 + 侧栏 */
        .game-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: stretch;
            flex: 1;
            min-height: 0;
        }

        .board-wrap {
            position: relative;
            flex: 0 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 1px;
            background: #1a1a2e;
            padding: 3px;
            border-radius: 8px;
            height: 100%;
            aspect-ratio: 1 / 2;
            max-height: 100%;
        }

        .cell {
            background: #16213e;
            border-radius: 2px;
        }

        .cell.filled {
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3), inset 0 3px 0 rgba(255, 255, 255, 0.3);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 0 0 90px;
            min-width: 0;
        }

        .info-box {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 5px 4px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-box .label {
            font-size: 0.65em;
            color: #666;
            margin-bottom: 2px;
        }

        .info-box .value {
            font-size: 1em;
            font-weight: bold;
            color: #2a5298;
        }

        .next-box {
            background: #f0f4ff;
            border-radius: 8px;
            padding: 5px 4px;
            text-align: center;
            flex: 0 0 auto;
        }

        .next-box .label {
            font-size: 0.65em;
            color: #666;
            margin-bottom: 4px;
        }

        #next-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            width: 60px;
            height: 60px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 2px;
            border-radius: 5px;
        }

        #next-board .cell {
            border-radius: 2px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 46, 0.92);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 10px;
            text-align: center;
            padding: 16px;
            z-index: 50;
        }

        .overlay.show {
            display: flex;
        }

        .overlay h2 {
            font-size: 1.2em;
        }

        .overlay p {
            font-size: 0.85em;
            color: #aac;
        }

        /* 操作按钮：固定在底部 */
        .touch-pad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex-shrink: 0;
        }

        .touch-pad button {
            padding: 12px 2px;
            font-size: 0.95em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #e8eeff, #d0ddf5);
            color: #2a5298;
            cursor: pointer;
            transition: transform 0.1s, background 0.15s;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .touch-pad button:active {
            transform: scale(0.9);
            background: #b8c8e8;
        }

        .touch-pad button.drop-btn {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
        }

        /* 底部按钮（重新开始 + 返回主页） */
        .bottom-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-shrink: 0;
        }

        .bottom-bar button, .bottom-bar .link-btn {
            flex: 1;
            padding: 9px 6px;
            border: none;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: transform 0.15s;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            box-shadow: 0 3px 10px rgba(42, 82, 152, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #2a5298;
        }

        .bottom-bar button:active, .bottom-bar .link-btn:active {
            transform: scale(0.95);
        }

        /* 说明：用可折叠的小图标，节省空间 */
        .rules-toggle {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f0f4ff;
            color: #2a5298;
            border: none;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 60;
        }

        .rules-panel {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .rules-panel.show {
            display: flex;
        }

        .rules-content {
            background: white;
            border-radius: 14px;
            padding: 20px;
            max-width: 320px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            font-size: 0.85em;
            line-height: 1.6;
            color: #555;
        }

        .rules-content h3 {
            color: #2a5298;
            margin-bottom: 10px;
            font-size: 1.1em;
            text-align: center;
        }

        .rules-content p {
            margin-bottom: 6px;
        }

        .key-hint {
            display: inline-block;
            background: #e8eeff;
            border: 1px solid #ccd6f0;
            border-radius: 4px;
            padding: 0 5px;
            font-family: monospace;
            font-size: 0.9em;
            margin: 0 2px;
            color: #2a5298;
        }

        .rules-content .close-btn {
            display: block;
            margin: 12px auto 0;
            padding: 8px 24px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* 电脑端稍微放大 */
        @media (min-width: 600px) {
            .header h1 {
                font-size: 1.4em;
            }
            .side-panel {
                flex: 0 0 130px;
            }
            .info-box .value {
                font-size: 1.3em;
            }
            #next-board {
                width: 90px;
                height: 90px;
            }
            .touch-pad button {
                padding: 14px 4px;
                font-size: 1.05em;
            }
            .bottom-bar button, .bottom-bar .link-btn {
                font-size: 0.9em;
                padding: 10px 8px;
            }
        }

        /* 高度不足时进一步压缩 */
        @media (max-height: 640px) {
            .header {
                display: none;
            }
            .game-container {
                padding: 8px;
                gap: 6px;
            }
            .touch-pad button {
                padding: 9px 2px;
                font-size: 0.85em;
            }
            .bottom-bar button, .bottom-bar .link-btn {
                padding: 7px 6px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🧱 俄罗斯方块 🧱</h1>
        </div>

        <div class="game-area">
            <div class="board-wrap">
                <div id="game-board"></div>
                <div class="overlay" id="overlay">
                    <h2 id="overlay-title">游戏结束</h2>
                    <p id="overlay-text">最终得分：0</p>
                    <button class="btn-primary" style="padding:10px 24px;border:none;border-radius:20px;color:white;font-weight:bold;cursor:pointer;" onclick="initGame()">再来一局</button>
                </div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <div class="label">得分</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="info-box">
                    <div class="label">行数</div>
                    <div class="value" id="lines">0</div>
                </div>
                <div class="info-box">
                    <div class="label">等级</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="next-box">
                    <div class="label">下一个</div>
                    <div id="next-board"></div>
                </div>
            </div>
        </div>

        <!-- 触摸控制按钮 -->
        <div class="touch-pad">
            <button onmousedown="moveLeft()" ontouchstart="event.preventDefault();moveLeft()">← 左</button>
            <button onmousedown="rotate()" ontouchstart="event.preventDefault();rotate()">↻ 旋</button>
            <button onmousedown="moveRight()" ontouchstart="event.preventDefault();moveRight()">右 →</button>
            <button class="drop-btn" onmousedown="hardDrop()" ontouchstart="event.preventDefault();hardDrop()">⬇ 落底</button>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-bar">
            <button class="btn-primary" onclick="initGame()">🔄 重新开始</button>
            <a href="index.html" class="link-btn btn-secondary">🏠 返回主页</a>
        </div>

        <!-- 说明按钮和弹窗 -->
        <button class="rules-toggle" onclick="toggleRules()">?</button>
        <div class="rules-panel" id="rulesPanel">
            <div class="rules-content">
                <h3>📖 游戏说明</h3>
                <p>1. 让方块填满整行即可消除，堆到顶部游戏结束。</p>
                <p>2. 电脑：<span class="key-hint">←</span><span class="key-hint">→</span> 移动，
                   <span class="key-hint">↑</span> 旋转，
                   <span class="key-hint">↓</span> 加速，
                   <span class="key-hint">空格</span> 落底。</p>
                <p>3. 手机：点击下方按钮操作，或在棋盘上滑动操作。</p>
                <p>4. 消除行数越多得分越高，每 10 行升一级，速度加快。</p>
                <button class="close-btn" onclick="toggleRules()">知道了</button>
            </div>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;

        const COLORS = {
            I: '#00f0f0',
            J: '#0000f0',
            L: '#f0a000',
            O: '#f0f000',
            S: '#00f000',
            T: '#a000f0',
            Z: '#f00000'
        };

        const SHAPES = {
            I: [[1, 1, 1, 1]],
            J: [[1, 0, 0], [1, 1, 1]],
            L: [[0, 0, 1], [1, 1, 1]],
            O: [[1, 1], [1, 1]],
            S: [[0, 1, 1], [1, 1, 0]],
            T: [[0, 1, 0], [1, 1, 1]],
            Z: [[1, 1, 0], [0, 1, 1]]
        };

        const TYPES = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];

        let board = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropInterval = 800;
        let dropCounter = 0;
        let lastTime = 0;
        let gameOver = false;
        let paused = false;

        let currentPiece = null;
        let nextPiece = null;

        const boardEl = document.getElementById('game-board');
        const nextBoardEl = document.getElementById('next-board');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const overlayEl = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');

        function toggleRules() {
            document.getElementById('rulesPanel').classList.toggle('show');
        }

        function createEmptyBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = new Array(COLS).fill(null);
            }
        }

        function randomPiece() {
            const type = TYPES[Math.floor(Math.random() * TYPES.length)];
            const shape = SHAPES[type].map(row => [...row]);
            return {
                type,
                shape,
                x: Math.floor((COLS - shape[0].length) / 2),
                y: 0
            };
        }

        function rotateShape(shape) {
            const rows = shape.length;
            const cols = shape[0].length;
            const rotated = [];
            for (let c = 0; c < cols; c++) {
                rotated[c] = [];
                for (let r = rows - 1; r >= 0; r--) {
                    rotated[c].push(shape[r][c]);
                }
            }
            return rotated;
        }

        function isValid(shape, x, y) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c]) {
                        const nx = x + c;
                        const ny = y + r;
                        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
                        if (ny >= 0 && board[ny][nx]) return false;
                    }
                }
            }
            return true;
        }

        function lockPiece() {
            const { shape, x, y, type } = currentPiece;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c]) {
                        const ny = y + r;
                        const nx = x + c;
                        if (ny >= 0) {
                            board[ny][nx] = type;
                        }
                    }
                }
            }

            clearLines();

            currentPiece = nextPiece;
            nextPiece = randomPiece();
            renderNext();

            if (!isValid(currentPiece.shape, currentPiece.x, currentPiece.y)) {
                endGame();
            }
        }

        function clearLines() {
            let cleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== null)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(null));
                    cleared++;
                    r++;
                }
            }

            if (cleared > 0) {
                lines += cleared;
                const points = [0, 100, 300, 500, 800];
                score += points[cleared] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 800 - (level - 1) * 70);
                updateInfo();
            }
        }

        function updateInfo() {
            scoreEl.textContent = score;
            linesEl.textContent = lines;
            levelEl.textContent = level;
        }

        function moveLeft() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.x--;
                render();
            }
        }

        function moveRight() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.x++;
                render();
            }
        }

        function moveDown() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                render();
            } else {
                lockPiece();
                render();
            }
        }

        function rotate() {
            if (gameOver || paused || !currentPiece) return;
            const rotated = rotateShape(currentPiece.shape);
            const kicks = [0, -1, 1, -2, 2];
            for (const kick of kicks) {
                if (isValid(rotated, currentPiece.x + kick, currentPiece.y)) {
                    currentPiece.shape = rotated;
                    currentPiece.x += kick;
                    render();
                    return;
                }
            }
        }

        function hardDrop() {
            if (gameOver || paused || !currentPiece) return;
            while (isValid(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                score += 2;
            }
            lockPiece();
            updateInfo();
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = board[r][c];
                    if (val) {
                        cell.classList.add('filled');
                        cell.style.background = COLORS[val];
                    }
                    boardEl.appendChild(cell);
                }
            }

            if (currentPiece) {
                const { shape, x, y, type } = currentPiece;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[0].length; c++) {
                        if (shape[r][c]) {
                            const ny = y + r;
                            const nx = x + c;
                            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
                                const index = ny * COLS + nx;
                                const cell = boardEl.children[index];
                                if (cell) {
                                    cell.classList.add('filled');
                                    cell.style.background = COLORS[type];
                                }
                            }
                        }
                    }
                }
            }
        }

        function renderNext() {
            nextBoardEl.innerHTML = '';
            const shape = nextPiece ? nextPiece.shape : [[0]];
            const type = nextPiece ? nextPiece.type : null;

            const offsetX = Math.floor((4 - shape[0].length) / 2);
            const offsetY = Math.floor((4 - shape.length) / 2);

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const sr = r - offsetY;
                    const sc = c - offsetX;
                    if (
                        sr >= 0 && sr < shape.length &&
                        sc >= 0 && sc < shape[0].length &&
                        shape[sr][sc]
                    ) {
                        cell.classList.add('filled');
                        cell.style.background = COLORS[type];
                    }
                    nextBoardEl.appendChild(cell);
                }
            }
        }

        function endGame() {
            gameOver = true;
            overlayTitle.textContent = '游戏结束';
            overlayText.textContent = `最终得分：${score}`;
            overlayEl.classList.add('show');
        }

        function update(time = 0) {
            if (!gameOver) {
                const delta = time - lastTime;
                lastTime = time;

                if (!paused) {
                    dropCounter += delta;
                    if (dropCounter > dropInterval) {
                        moveDown();
                        dropCounter = 0;
                    }
                }
            }
            requestAnimationFrame(update);
        }

        function initGame() {
            createEmptyBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 800;
            dropCounter = 0;
            lastTime = 0;
            gameOver = false;
            paused = false;

            currentPiece = randomPiece();
            nextPiece = randomPiece();

            overlayEl.classList.remove('show');
            updateInfo();
            renderNext();
            render();

            requestAnimationFrame(update);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowLeft': moveLeft(); break;
                case 'ArrowRight': moveRight(); break;
                case 'ArrowDown': moveDown(); break;
                case 'ArrowUp': rotate(); break;
                case ' ': hardDrop(); break;
            }
        });

        // 触摸滑动
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        let touchMoved = false;

        boardEl.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
            touchStartTime = Date.now();
            touchMoved = false;
        }, { passive: true });

        boardEl.addEventListener('touchmove', (e) => {
            touchMoved = true;
        }, { passive: true });

        boardEl.addEventListener('touchend', (e) => {
            if (!e.changedTouches[0]) return;
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            const dt = Date.now() - touchStartTime;
            const absX = Math.abs(dx), absY = Math.abs(dy);

            if (!touchMoved && absX < 15 && absY < 15 && dt < 250) {
                rotate();
                return;
            }

            if (absX > absY) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy > 60) hardDrop();
                else if (dy > 20) moveDown();
                else if (dy < -30) rotate();
            }
        }, { passive: true });

        initGame();
    </script>
</body>
</html>
