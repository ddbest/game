<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            max-width: 560px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.6em;
            color: #2a5298;
        }

        .game-area {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .board-wrap {
            position: relative;
        }

        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(20, 1fr);
            gap: 1px;
            background: #1a1a2e;
            padding: 4px;
            border-radius: 10px;
            width: 260px;
            height: 520px;
        }

        .cell {
            background: #16213e;
            border-radius: 2px;
        }

        .cell.filled {
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3), inset 0 3px 0 rgba(255, 255, 255, 0.3);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 140px;
        }

        .info-box {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .info-box .label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 4px;
        }

        .info-box .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #2a5298;
        }

        .next-box {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .next-box .label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
        }

        #next-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2px;
            width: 100px;
            height: 100px;
            margin: 0 auto;
            background: #1a1a2e;
            padding: 3px;
            border-radius: 6px;
        }

        #next-board .cell {
            border-radius: 2px;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            gap: 12px;
            text-align: center;
            padding: 20px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay h2 {
            font-size: 1.5em;
        }

        .overlay p {
            font-size: 1em;
            color: #aac;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        button, .link-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            box-shadow: 0 4px 12px rgba(42, 82, 152, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #2a5298;
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .rules {
            margin-top: 15px;
            background: #fafbff;
            border-left: 4px solid #2a5298;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            line-height: 1.6;
            color: #555;
        }

        .rules h3 {
            color: #2a5298;
            margin-bottom: 6px;
            font-size: 1em;
        }

        .key-hint {
            display: inline-block;
            background: #e8eeff;
            border: 1px solid #ccd6f0;
            border-radius: 4px;
            padding: 1px 6px;
            font-family: monospace;
            font-size: 0.9em;
            margin: 0 2px;
            color: #2a5298;
        }

        @media (max-width: 520px) {
            #game-board {
                width: 200px;
                height: 400px;
            }
            .side-panel {
                flex-direction: row;
                min-width: auto;
                flex-wrap: wrap;
                justify-content: center;
            }
            .info-box, .next-box {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🧱 俄罗斯方块 🧱</h1>
        </div>

        <div class="game-area">
            <div class="board-wrap">
                <div id="game-board"></div>
                <div class="overlay" id="overlay">
                    <h2 id="overlay-title">游戏结束</h2>
                    <p id="overlay-text">最终得分：0</p>
                    <button class="btn-primary" onclick="initGame()">再来一局</button>
                </div>
            </div>

            <div class="side-panel">
                <div class="info-box">
                    <div class="label">得分</div>
                    <div class="value" id="score">0</div>
                </div>
                <div class="info-box">
                    <div class="label">消除行数</div>
                    <div class="value" id="lines">0</div>
                </div>
                <div class="info-box">
                    <div class="label">等级</div>
                    <div class="value" id="level">1</div>
                </div>
                <div class="next-box">
                    <div class="label">下一个</div>
                    <div id="next-board"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="initGame()">🔄 重新开始</button>
            <a href="index.html" class="link-btn btn-secondary">🏠 返回主页</a>
        </div>

        <div class="rules">
            <h3>📖 游戏说明</h3>
            <p>1. 使用键盘控制方块移动和旋转，让它们填满整行即可消除。</p>
            <p>2. 操作键：<span class="key-hint">←</span> <span class="key-hint">→</span> 左右移动，
               <span class="key-hint">↓</span> 加速下落，
               <span class="key-hint">↑</span> 旋转，
               <span class="key-hint">空格</span> 直接落底。</p>
            <p>3. 消除行数越多，得分越高，等级也会提升，下落速度会加快。</p>
            <p>4. 方块堆到顶部无法放置时，游戏结束。</p>
            <p>5. 手机端可以点击下方按钮进行移动和旋转。</p>
        </div>

        <div class="controls" style="margin-top: 10px;">
            <button class="btn-secondary" onclick="moveLeft()">← 左移</button>
            <button class="btn-secondary" onclick="rotate()">↻ 旋转</button>
            <button class="btn-secondary" onclick="moveRight()">右移 →</button>
            <button class="btn-secondary" onclick="hardDrop()">⬇ 落底</button>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 26;

        const COLORS = {
            I: '#00f0f0',
            J: '#0000f0',
            L: '#f0a000',
            O: '#f0f000',
            S: '#00f000',
            T: '#a000f0',
            Z: '#f00000'
        };

        const SHAPES = {
            I: [[1, 1, 1, 1]],
            J: [[1, 0, 0], [1, 1, 1]],
            L: [[0, 0, 1], [1, 1, 1]],
            O: [[1, 1], [1, 1]],
            S: [[0, 1, 1], [1, 1, 0]],
            T: [[0, 1, 0], [1, 1, 1]],
            Z: [[1, 1, 0], [0, 1, 1]]
        };

        const TYPES = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];

        let board = [];
        let score = 0;
        let lines = 0;
        let level = 1;
        let dropInterval = 800;
        let dropCounter = 0;
        let lastTime = 0;
        let gameOver = false;
        let paused = false;

        let currentPiece = null;
        let nextPiece = null;

        const boardEl = document.getElementById('game-board');
        const nextBoardEl = document.getElementById('next-board');
        const scoreEl = document.getElementById('score');
        const linesEl = document.getElementById('lines');
        const levelEl = document.getElementById('level');
        const overlayEl = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');

        function createEmptyBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = new Array(COLS).fill(null);
            }
        }

        function randomPiece() {
            const type = TYPES[Math.floor(Math.random() * TYPES.length)];
            const shape = SHAPES[type].map(row => [...row]);
            return {
                type,
                shape,
                x: Math.floor((COLS - shape[0].length) / 2),
                y: 0
            };
        }

        function rotateShape(shape) {
            const rows = shape.length;
            const cols = shape[0].length;
            const rotated = [];
            for (let c = 0; c < cols; c++) {
                rotated[c] = [];
                for (let r = rows - 1; r >= 0; r--) {
                    rotated[c].push(shape[r][c]);
                }
            }
            return rotated;
        }

        function isValid(shape, x, y) {
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c]) {
                        const nx = x + c;
                        const ny = y + r;
                        if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
                        if (ny >= 0 && board[ny][nx]) return false;
                    }
                }
            }
            return true;
        }

        function lockPiece() {
            const { shape, x, y, type } = currentPiece;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[0].length; c++) {
                    if (shape[r][c]) {
                        const ny = y + r;
                        const nx = x + c;
                        if (ny >= 0) {
                            board[ny][nx] = type;
                        }
                    }
                }
            }

            clearLines();

            // 生成新方块
            currentPiece = nextPiece;
            nextPiece = randomPiece();
            renderNext();

            if (!isValid(currentPiece.shape, currentPiece.x, currentPiece.y)) {
                endGame();
            }
        }

        function clearLines() {
            let cleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== null)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(null));
                    cleared++;
                    r++;
                }
            }

            if (cleared > 0) {
                lines += cleared;
                // 得分规则
                const points = [0, 100, 300, 500, 800];
                score += points[cleared] * level;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 800 - (level - 1) * 70);
                updateInfo();
            }
        }

        function updateInfo() {
            scoreEl.textContent = score;
            linesEl.textContent = lines;
            levelEl.textContent = level;
        }

        function moveLeft() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x - 1, currentPiece.y)) {
                currentPiece.x--;
                render();
            }
        }

        function moveRight() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x + 1, currentPiece.y)) {
                currentPiece.x++;
                render();
            }
        }

        function moveDown() {
            if (gameOver || paused || !currentPiece) return;
            if (isValid(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                render();
            } else {
                lockPiece();
                render();
            }
        }

        function rotate() {
            if (gameOver || paused || !currentPiece) return;
            const rotated = rotateShape(currentPiece.shape);
            // 踢墙处理
            const kicks = [0, -1, 1, -2, 2];
            for (const kick of kicks) {
                if (isValid(rotated, currentPiece.x + kick, currentPiece.y)) {
                    currentPiece.shape = rotated;
                    currentPiece.x += kick;
                    render();
                    return;
                }
            }
        }

        function hardDrop() {
            if (gameOver || paused || !currentPiece) return;
            while (isValid(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
                currentPiece.y++;
                score += 2;
            }
            lockPiece();
            updateInfo();
            render();
        }

        function render() {
            boardEl.innerHTML = '';
            // 绘制底板
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = board[r][c];
                    if (val) {
                        cell.classList.add('filled');
                        cell.style.background = COLORS[val];
                    }
                    boardEl.appendChild(cell);
                }
            }

            // 绘制当前方块
            if (currentPiece) {
                const { shape, x, y, type } = currentPiece;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[0].length; c++) {
                        if (shape[r][c]) {
                            const ny = y + r;
                            const nx = x + c;
                            if (ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
                                const index = ny * COLS + nx;
                                const cell = boardEl.children[index];
                                if (cell) {
                                    cell.classList.add('filled');
                                    cell.style.background = COLORS[type];
                                }
                            }
                        }
                    }
                }
            }
        }

        function renderNext() {
            nextBoardEl.innerHTML = '';
            const shape = nextPiece ? nextPiece.shape : [[0]];
            const type = nextPiece ? nextPiece.type : null;

            // 4x4 网格居中显示
            const offsetX = Math.floor((4 - shape[0].length) / 2);
            const offsetY = Math.floor((4 - shape.length) / 2);

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const sr = r - offsetY;
                    const sc = c - offsetX;
                    if (
                        sr >= 0 && sr < shape.length &&
                        sc >= 0 && sc < shape[0].length &&
                        shape[sr][sc]
                    ) {
                        cell.classList.add('filled');
                        cell.style.background = COLORS[type];
                    }
                    nextBoardEl.appendChild(cell);
                }
            }
        }

        function endGame() {
            gameOver = true;
            overlayTitle.textContent = '游戏结束';
            overlayText.textContent = `最终得分：${score}`;
            overlayEl.classList.add('show');
        }

        function update(time = 0) {
            if (gameOver) return;
            const delta = time - lastTime;
            lastTime = time;

            if (!paused) {
                dropCounter += delta;
                if (dropCounter > dropInterval) {
                    moveDown();
                    dropCounter = 0;
                }
            }
            requestAnimationFrame(update);
        }

        function initGame() {
            createEmptyBoard();
            score = 0;
            lines = 0;
            level = 1;
            dropInterval = 800;
            dropCounter = 0;
            lastTime = 0;
            gameOver = false;
            paused = false;

            currentPiece = randomPiece();
            nextPiece = randomPiece();

            overlayEl.classList.remove('show');
            updateInfo();
            renderNext();
            render();

            requestAnimationFrame(update);
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(e.key)) {
                e.preventDefault();
            }
            switch (e.key) {
                case 'ArrowLeft': moveLeft(); break;
                case 'ArrowRight': moveRight(); break;
                case 'ArrowDown': moveDown(); break;
                case 'ArrowUp': rotate(); break;
                case ' ': hardDrop(); break;
            }
        });

        initGame();
    </script>
</body>
</html>
