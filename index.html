<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 我的游戏盒子</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 30px 20px;
            color: #333;
        }

        /* 顶部装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* 顶部标题栏 */
        .top-bar {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease-out;
        }

        .top-bar h1 {
            font-size: clamp(1.6em, 4vw, 2.4em);
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            letter-spacing: 1px;
        }

        .top-bar p {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.85em, 2.2vw, 1em);
        }

        /* 卡片网格 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            padding: 22px 16px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
            animation: fadeInUp 0.5s ease-out backwards;
        }

        .game-card:nth-child(1) { animation-delay: 0.05s; }
        .game-card:nth-child(2) { animation-delay: 0.1s; }
        .game-card:nth-child(3) { animation-delay: 0.15s; }
        .game-card:nth-child(4) { animation-delay: 0.2s; }
        .game-card:nth-child(5) { animation-delay: 0.25s; }
        .game-card:nth-child(6) { animation-delay: 0.3s; }
        .game-card:nth-child(7) { animation-delay: 0.35s; }
        .game-card:nth-child(8) { animation-delay: 0.4s; }
        .game-card:nth-child(9) { animation-delay: 0.45s; }
        .game-card:nth-child(10) { animation-delay: 0.5s; }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--card-color, linear-gradient(90deg, #667eea, #764ba2));
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        .game-card:active {
            transform: translateY(-3px) scale(0.99);
        }

        .game-icon {
            font-size: 2.8em;
            margin-bottom: 12px;
            line-height: 1;
            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.12));
        }

        .game-name {
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 6px;
            color: #2d3748;
        }

        .game-desc {
            font-size: 0.8em;
            color: #888;
            line-height: 1.4;
        }

        /* 每个卡片的顶部颜色条 */
        .card-mario { --card-color: linear-gradient(90deg, #ff6b6b, #e63946); }
        .card-tetris { --card-color: linear-gradient(90deg, #4facfe, #0077b6); }
        .card-eliminate { --card-color: linear-gradient(90deg, #a8e063, #56ab2f); }
        .card-sheep { --card-color: linear-gradient(90deg, #a8e063, #2d6a4f); }
        .card-jump { --card-color: linear-gradient(90deg, #667eea, #764ba2); }
        .card-guess { --card-color: linear-gradient(90deg, #f093fb, #f5576c); }
        .card-sudoku { --card-color: linear-gradient(90deg, #4facfe, #00f2fe); }
        .card-minesweeper { --card-color: linear-gradient(90deg, #546e7a, #37474f); }
        .card-about { --card-color: linear-gradient(90deg, #ffd93d, #ff9f1c); }

        /* 底部 */
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.85em;
            padding: 15px;
            line-height: 1.6;
        }

        .footer a {
            color: white;
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.5);
        }

        /* 动画 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 手机端适配 */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .top-bar {
                margin-bottom: 22px;
            }

            .game-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 20px;
            }

            .game-card {
                padding: 18px 10px;
                min-height: 140px;
                border-radius: 14px;
            }

            .game-icon {
                font-size: 2.3em;
                margin-bottom: 8px;
            }

            .game-name {
                font-size: 1em;
            }

            .game-desc {
                font-size: 0.72em;
            }
        }

        @media (max-width: 340px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 大屏 */
        @media (min-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h1>🎮 我的游戏盒子</h1>
            <p>点击下面的卡片开始游戏</p>
        </div>

        <div class="game-grid">
            <a href="mario.html" class="game-card card-mario">
                <div class="game-icon">🍄</div>
                <div class="game-name">超级玛丽</div>
                <div class="game-desc">横版跳跃冒险</div>
            </a>

            <a href="tetris.html" class="game-card card-tetris">
                <div class="game-icon">🧱</div>
                <div class="game-name">俄罗斯方块</div>
                <div class="game-desc">经典方块消除</div>
            </a>

            <a href="happy-match.html" class="game-card card-eliminate">
                <div class="game-icon">🍬</div>
                <div class="game-name">开心消消乐</div>
                <div class="game-desc">三消轻松一下</div>
            </a>

            <a href="sheep.html" class="game-card card-sheep">
                <div class="game-icon">🐑</div>
                <div class="game-name">羊了个羊</div>
                <div class="game-desc">烧脑卡牌消除</div>
            </a>

            <a href="jump.html" class="game-card card-jump">
                <div class="game-icon">🐸</div>
                <div class="game-name">跳一跳</div>
                <div class="game-desc">蓄力跳跃挑战</div>
            </a>

            <a href="guess.html" class="game-card card-guess">
                <div class="game-icon">🎯</div>
                <div class="game-name">猜数字</div>
                <div class="game-desc">10 次机会猜中</div>
            </a>

            <a href="sudoku.html" class="game-card card-sudoku">
                <div class="game-icon">🧩</div>
                <div class="game-name">数独</div>
                <div class="game-desc">9×9 逻辑推理</div>
            </a>
			
			<a href="subway.html" class="game-card card-subway">
				<div class="game-icon">🚇</div>
				<div class="game-name">地铁跑酷</div>
				<div class="game-desc">3D 躲避跑酷</div>
			</a>

           
        </div>

        <div class="footer" id="about">
            <p>🎮 小游戏合集</p>
           
        </div>
    </div>
</body>
</html>
