<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #2c3e50;
            color: #fff;
            font-family: "Microsoft Yahei", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 40px;
            color: #3498db;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .game-link {
            width: 280px;
            padding: 18px 24px;
            background-color: #34495e;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            transition: all 0.3s;
        }
        .game-link a {
            color: #fff;
            text-decoration: none;
            display:block;
        }
        .game-link:hover {
            background-color: #3498db;
            transform: scale(1.05);
        }
        .desc {
            margin-top:8px;
            font-size:14px;
            opacity:0.8;
        }
    </style>
</head>
<body>
    <h1>🎮 小游戏合集</h1>
    <div class="container">
        <div class="game-link">
            <a href="guess.html">猜数字游戏</a>
            <div class="desc">1~100猜数字，统计猜测次数</div>
        </div>
        <div class="game-link">
            <a href="move.html">方块移动游戏</a>
            <div class="desc">方向键控制方块移动</div>
        </div>
        <div class="game-link">
            <a href="match.html">简易消消乐</a>
            <div class="desc">点击相邻同色方块消除得分</div>
        </div>
        <div class="game-link">
            <a href="tetris.html">俄罗斯方块</a>
            <div class="desc">方向键控制方块，消除整行得分</div>
        </div>
    </div>
</body>
</html>
